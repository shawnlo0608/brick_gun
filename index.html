<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- 指定繁體中文語系，確保遊戲介面文字正確顯示。 -->
  <meta charset="UTF-8">
  <!-- 讓遊戲畫面在手機、平板與桌面瀏覽器中自動縮放。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 設定瀏覽器分頁標題。 -->
  <title>前線哨站 3D｜戰術生存射擊</title>
  <style>
    /* 統一所有元素的盒模型，讓版面尺寸容易預測。 */
    * { box-sizing: border-box; }
    /* 使用深色頁面背景，讓戰場視窗和 HUD 更突出。 */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101411; color: #e8e9df; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* 讓 3D 畫布填滿整個瀏覽器視窗。 */
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    /* 疊加柔和暗角，營造電影鏡頭與戰場觀察的氛圍。 */
    #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 48%, rgba(2,5,4,.5) 100%); }
    /* 左上角戰況面板使用半透明墨綠底色。 */
    .panel { position: fixed; z-index: 3; background: rgba(13,18,15,.72); border: 1px solid rgba(201,211,191,.25); box-shadow: 0 8px 26px rgba(0,0,0,.2); backdrop-filter: blur(8px); }
    /* 顯示左上角任務、時間與天氣資訊。 */
    #mission { top: 20px; left: 20px; min-width: 238px; padding: 13px 15px; border-radius: 4px; }
    /* 突顯任務狀態的第一行文字。 */
    .mission-title { margin-bottom: 9px; color: #e8ebdd; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
    /* 將時間、波次和天氣資料分成整齊的行。 */
    .statline { display: flex; justify-content: space-between; gap: 18px; color: #bcc6b9; font-size: 12px; line-height: 1.9; }
    /* 右上角分數面板採用緊湊樣式。 */
    #scorebox { top: 20px; right: 20px; padding: 11px 14px; border-radius: 4px; color: #e6e8dd; font: 600 13px ui-monospace, monospace; letter-spacing: .08em; }
    /* 右上角音效按鈕可以在戰鬥中切換音樂與效果音。 */
    #soundToggle { position: fixed; z-index: 10; top: 66px; right: 20px; padding: 8px 11px; color: #dfe5d8; background: rgba(13,18,15,.76); border: 1px solid rgba(201,211,191,.3); border-radius: 3px; font: 11px ui-monospace, monospace; letter-spacing: .08em; cursor: pointer; }
    /* 畫面底端中央顯示快捷武器選擇列。 */
    #weaponRack { position: fixed; z-index: 4; bottom: 20px; left: 50%; display: flex; gap: 5px; padding: 5px; transform: translateX(-50%); border-radius: 4px; }
    /* 每格快捷欄顯示按鍵、武器名稱與選取狀態。 */
    .weapon-slot { min-width: 94px; padding: 7px 10px; color: #aeb8aa; background: rgba(15,20,17,.76); border: 1px solid rgba(201,211,191,.23); text-align: center; font-size: 10px; letter-spacing: .04em; }
    /* 目前使用的武器以暖色邊框和亮字標示。 */
    .weapon-slot.active { color: #f0e6bf; border-color: rgba(219,196,125,.82); background: rgba(50,48,34,.86); }
    /* 顯示武器快捷鍵編號。 */
    .weapon-key { display: block; margin-bottom: 3px; color: #e4d79f; font: 600 12px ui-monospace, monospace; }
    /* 左下角生命值與體力顯示區。 */
    #vitals { left: 20px; bottom: 20px; width: 245px; padding: 13px 15px; border-radius: 4px; }
    /* 生命值和備用資源列的標籤樣式。 */
    .bar-label { display: flex; justify-content: space-between; margin-bottom: 6px; color: #d9ded2; font-size: 11px; }
    /* 設定狀態列背景槽。 */
    .bar { height: 7px; margin-bottom: 11px; overflow: hidden; background: rgba(222,232,213,.14); border: 1px solid rgba(230,236,221,.18); }
    /* 設定生命值填充色與平滑變化。 */
    #healthFill { width: 100%; height: 100%; background: linear-gradient(90deg, #71936a, #a9c18c); transition: width .15s, background .2s; }
    /* 設定體力條填充色。 */
    #staminaFill { width: 100%; height: 100%; background: #b5ad77; transition: width .1s; }
    /* 右下角彈藥與武器資訊面板。 */
    #ammo { right: 20px; bottom: 20px; min-width: 205px; padding: 12px 15px; border-radius: 4px; text-align: right; }
    /* 彈匣子彈數以較大字體顯示。 */
    #ammoCount { color: #f0eee4; font: 600 27px ui-monospace, monospace; letter-spacing: .03em; }
    /* 顯示武器名稱和換彈狀態。 */
    #weaponLabel { margin-top: 2px; color: #b3bdb0; font-size: 11px; letter-spacing: .08em; }
    /* 置中顯示四段式瞄準準星。 */
    #crosshair { position: fixed; z-index: 4; top: 50%; left: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%); pointer-events: none; }
    /* 準星中心的小圓環。 */
    #crosshair::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(247,245,228,.9); border-radius: 50%; box-shadow: 0 0 3px #000; }
    /* 用四條短線組成低調的戰術準星。 */
    #crosshair::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#f4f1df,#f4f1df) center top/1px 5px no-repeat, linear-gradient(#f4f1df,#f4f1df) center bottom/1px 5px no-repeat, linear-gradient(#f4f1df,#f4f1df) left center/5px 1px no-repeat, linear-gradient(#f4f1df,#f4f1df) right center/5px 1px no-repeat; filter: drop-shadow(0 0 2px #000); }
    /* 遊戲開始、暫停和失敗時使用同一個全畫面資訊層。 */
    #overlay { position: fixed; z-index: 8; inset: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(180deg, rgba(8,12,10,.42), rgba(7,11,9,.76)); text-align: center; cursor: pointer; }
    /* 隱藏狀態層時完全移出畫面互動。 */
    #overlay.hidden { display: none; }
    /* 資訊層中央卡片使用暗色玻璃感面板。 */
    .card { width: min(520px, 100%); padding: 30px 28px; border: 1px solid rgba(221,230,211,.33); border-radius: 5px; background: rgba(17,23,19,.83); box-shadow: 0 22px 90px #0008; backdrop-filter: blur(10px); }
    /* 主標題使用大字重與寬字距。 */
    #overlayTitle { margin: 0 0 10px; color: #edf0e4; font-size: clamp(24px, 4vw, 36px); letter-spacing: .09em; }
    /* 說明文字採用灰綠色，保持與背景的對比。 */
    #overlayText { margin: 0 auto 20px; max-width: 420px; color: #c3ccbe; font-size: 14px; line-height: 1.8; }
    /* 強調操作提示文字。 */
    #overlayHint { color: #ddcc93; font-size: 12px; letter-spacing: .14em; }
    /* 屏幕中央顯示短暫任務通知。 */
    #toast { position: fixed; z-index: 5; top: 22%; left: 50%; transform: translateX(-50%); padding: 9px 16px; color: #f0ead0; background: rgba(15,20,17,.72); border: 1px solid rgba(225,223,190,.27); font-size: 14px; letter-spacing: .1em; opacity: 0; transition: opacity .25s; pointer-events: none; }
    /* 只在通知有效時顯示文字。 */
    #toast.visible { opacity: 1; }
    /* 小螢幕將面板往內縮並減少邊距。 */
    @media (max-width: 640px) { #mission { top: 10px; left: 10px; min-width: 190px; padding: 9px 11px; } #scorebox { top: 10px; right: 10px; padding: 8px; font-size: 11px; } #soundToggle { top: 52px; right: 10px; } #vitals { left: 10px; bottom: 10px; width: 160px; padding: 9px 11px; } #ammo { right: 10px; bottom: 10px; min-width: 128px; padding: 8px 10px; } #ammoCount { font-size: 20px; } #weaponRack { bottom: 100px; gap: 3px; } .weapon-slot { min-width: 72px; padding: 6px 5px; font-size: 9px; } }
  </style>
</head>
<body>
  <!-- WebGL 3D 場景會由 JavaScript 繪製在這張畫布上。 -->
  <canvas id="game" aria-label="第一人稱 3D 戰術射擊遊戲畫面"></canvas>
  <!-- 疊加電影感暗角，不會攔截滑鼠操作。 -->
  <div id="vignette"></div>
  <!-- 顯示任務波次、遊戲時間與目前天氣。 -->
  <section id="mission" class="panel" aria-live="polite">
    <!-- 左上面板標題。 -->
    <div class="mission-title">前線哨站　/　生存任務</div>
    <!-- 透過 JavaScript 更新目前波次。 -->
    <div class="statline"><span>敵軍波次</span><strong id="waveValue">01</strong></div>
    <!-- 透過 JavaScript 更新日夜時間。 -->
    <div class="statline"><span>戰場時間</span><strong id="timeValue">06:00</strong></div>
    <!-- 透過 JavaScript 更新天氣狀態。 -->
    <div class="statline"><span>天候狀態</span><strong id="weatherValue">晴朗</strong></div>
  </section>
  <!-- 顯示目前累積分數。 -->
  <div id="scorebox" class="panel">SCORE <span id="scoreValue">000000</span></div>
  <!-- 讓玩家能開關背景音樂和戰鬥音效。 -->
  <button id="soundToggle" type="button">SOUND　ON</button>
  <!-- 顯示玩家生命值與衝刺體力。 -->
  <section id="vitals" class="panel">
    <!-- 顯示生命值與目前數值。 -->
    <div class="bar-label"><span>生命狀態</span><strong id="healthValue">100</strong></div>
    <!-- 生命值填充寬度由 JavaScript 控制。 -->
    <div class="bar"><div id="healthFill"></div></div>
    <!-- 顯示體力標籤與衝刺提示。 -->
    <div class="bar-label"><span>體力／衝刺</span><span id="staminaValue">100%</span></div>
    <!-- 體力條填充寬度由 JavaScript 控制。 -->
    <div class="bar" style="margin-bottom:0"><div id="staminaFill"></div></div>
  </section>
  <!-- 顯示目前彈匣與備用彈藥。 -->
  <section id="ammo" class="panel">
    <!-- JavaScript 會更新目前子彈和備彈數。 -->
    <div id="ammoCount">30 <span style="color:#899184;font-size:17px">/ 180</span></div>
    <!-- 顯示武器種類或裝填狀態。 -->
    <div id="weaponLabel">突擊步槍　·　READY</div>
  </section>
  <!-- 顯示步槍、狙擊槍和散彈槍的快捷切換提示。 -->
  <div id="weaponRack" class="panel" aria-label="武器選擇列">
    <!-- 數字 1 切換至突擊步槍。 -->
    <div class="weapon-slot active" data-slot="0"><span class="weapon-key">1</span>突擊步槍</div>
    <!-- 數字 2 切換至狙擊步槍。 -->
    <div class="weapon-slot" data-slot="1"><span class="weapon-key">2</span>狙擊槍</div>
    <!-- 數字 3 切換至散彈槍。 -->
    <div class="weapon-slot" data-slot="2"><span class="weapon-key">3</span>散彈槍</div>
  </div>
  <!-- 固定準星在視窗中央，對應滑鼠視角方向。 -->
  <div id="crosshair" aria-hidden="true"></div>
  <!-- 用於顯示命中、換彈與波次通知。 -->
  <div id="toast" role="status"></div>
  <!-- 遊戲開始、暫停或結束時顯示的互動面板。 -->
  <div id="overlay">
    <!-- 中央卡片呈現操作教學與狀態訊息。 -->
    <div class="card">
      <!-- 面板標題會依遊戲狀態動態變更。 -->
      <h1 id="overlayTitle">前線哨站</h1>
      <!-- 面板說明文字會依狀態動態更新。 -->
      <p id="overlayText">第一人稱 3D 生存射擊。清除逐波逼近的敵軍，在變化的日夜與天候中守住哨站。WASD 移動、滑鼠瞄準、左鍵射擊；按 1／2／3 切換武器，R 換彈，M 切換音效。</p>
      <!-- 開始遊戲或重新取得滑鼠視角的提示。 -->
      <div id="overlayHint">點擊畫面進入戰場　·　ESC 可釋放滑鼠</div>
    </div>
  </div>
  <script type="module">
    // 從 Three.js CDN 匯入 3D 場景、幾何、材質與渲染工具。
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    // 取得畫布元素，讓 Three.js 將 3D 場景輸出到指定位置。
    const canvas = document.getElementById('game');
    // 取得遊戲開始／暫停覆蓋面板。
    const overlay = document.getElementById('overlay');
    // 取得覆蓋面板標題節點。
    const overlayTitle = document.getElementById('overlayTitle');
    // 取得覆蓋面板操作說明節點。
    const overlayText = document.getElementById('overlayText');
    // 取得覆蓋面板提示文字節點。
    const overlayHint = document.getElementById('overlayHint');
    // 取得中央短暫提示訊息節點。
    const toast = document.getElementById('toast');
    // 取得音效開關按鈕與三個武器快捷欄。
    const soundToggle = document.getElementById('soundToggle'), weaponSlots = [...document.querySelectorAll('.weapon-slot')];
    // 取得 HUD 中所有需要更新的文字與狀態條元素。
    const ui = { wave: document.getElementById('waveValue'), time: document.getElementById('timeValue'), weather: document.getElementById('weatherValue'), score: document.getElementById('scoreValue'), health: document.getElementById('healthValue'), healthFill: document.getElementById('healthFill'), stamina: document.getElementById('staminaValue'), staminaFill: document.getElementById('staminaFill'), ammo: document.getElementById('ammoCount'), weapon: document.getElementById('weaponLabel') };
    // 設定基本畫面寬高，實際尺寸會隨瀏覽器大小調整。
    const initialWidth = window.innerWidth;
    // 記錄目前畫面高度，供攝影機比例計算使用。
    const initialHeight = window.innerHeight;
    // 設定遊戲日夜完整循環長度，單位為毫秒。
    const DAY_LENGTH = 165000;
    // 設定戰場中可行走範圍的半寬度。
    const WORLD_LIMIT = 190;
    // 記錄玩家鍵盤輸入狀態。
    const keys = Object.create(null);
    // 建立 Three.js 的 3D 場景容器。
    const scene = new THREE.Scene();
    // 建立天空與遠景霧氣的基礎色彩。
    const skyColor = new THREE.Color('#c5d0cf');
    // 設定場景背景為天空色，後續會隨日夜變化。
    scene.background = skyColor;
    // 加入線性霧效，遮掩遠方地形邊界並增加大氣感。
    scene.fog = new THREE.Fog(skyColor, 55, 185);
    // 建立高品質 WebGL 渲染器並使用抗鋸齒。
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    // 讓畫面解析度跟隨裝置像素比，但限制上限避免過度耗用效能。
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    // 讓渲染器大小與瀏覽器畫面一致。
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    // 使用 ACES 電影色調映射，提升明暗層次與寫實感。
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    // 設定適中的曝光度，避免正午或槍口火光過曝。
    renderer.toneMappingExposure = 1.05;
    // 使用 sRGB 輸出色彩，讓材質色彩在螢幕上正確呈現。
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    // 啟用柔和陰影渲染。
    renderer.shadowMap.enabled = true;
    // 設定較柔和的 PCF 陰影過濾品質。
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // 建立第一人稱透視攝影機。
    const camera = new THREE.PerspectiveCamera(74, window.innerWidth / window.innerHeight, 0.08, 250);
    // 將攝影機放在一般人眼高度。
    camera.position.set(0, 1.7, 0);
    // 建立三維座標工具物件，供移動與瞄準運算重複使用。
    const forward = new THREE.Vector3();
    // 建立玩家向右移動方向向量。
    const right = new THREE.Vector3();
    // 建立臨時計算向量，避免每一幀反覆建立大量物件。
    const tempVector = new THREE.Vector3();
    // 記錄玩家左右視角角度。
    let yaw = 0;
    // 記錄玩家上下視角角度。
    let pitch = 0;
    // 記錄遊戲目前是否已進入滑鼠鎖定狀態。
    let locked = false;
    // 記錄遊戲是否暫停或結束。
    let paused = false;
    // 記錄遊戲是否已經結束。
    let gameOver = false;
    // 記錄玩家是否按住滑鼠開火。
    let mouseDown = false;
    // 記錄本場遊戲是否已正式開始。
    let started = false;
    // 記錄日夜循環啟動時間。
    let dayStart = performance.now() - DAY_LENGTH * .32;
    // 記錄最近一幀的時間戳記。
    let lastFrame = performance.now();
    // 記錄最近一次天候切換時間。
    let weatherChangedAt = performance.now();
    // 設定自動輪替的天氣狀態。
    const weatherCycle = ['晴朗', '降雨', '濃霧', '降雪', '雷暴'];
    // 記錄目前的天氣狀態。
    let weather = '晴朗';
    // 記錄目前天候在循環清單中的位置。
    let weatherIndex = 0;
    // 記錄雷暴閃電效果結束時間。
    let lightningUntil = 0;
    // 記錄玩家目前生命值。
    let health = 100;
    // 記錄玩家目前衝刺體力。
    let stamina = 100;
    // 記錄目前彈匣內的子彈數量。
    let ammo = 30;
    // 記錄目前可用的備用彈藥數量。
    let reserveAmmo = 180;
    // 定義突擊步槍、狙擊槍與散彈槍的射擊和裝填參數。
    const weaponTypes = [
      { id: 'rifle', name: '突擊步槍', shortName: 'RIFLE', magazine: 30, reserve: 180, damage: 52, cooldown: 185, reloadMs: 1450, range: 92, pellets: 1, spread: 0, sound: 'rifle' },
      { id: 'sniper', name: '狙擊步槍', shortName: 'SNIPER', magazine: 5, reserve: 45, damage: 140, cooldown: 930, reloadMs: 2350, range: 220, pellets: 1, spread: 0, sound: 'sniper' },
      { id: 'shotgun', name: '散彈槍', shortName: 'SHOTGUN', magazine: 8, reserve: 72, damage: 14, cooldown: 720, reloadMs: 1900, range: 48, pellets: 8, spread: .085, sound: 'shotgun' }
    ];
    // 為每種武器保存各自的彈匣和備用彈藥數量。
    const weaponInventory = weaponTypes.map((item) => ({ ammo: item.magazine, reserve: item.reserve }));
    // 記錄目前選取的武器索引，預設為突擊步槍。
    let weaponIndex = 0;
    // 記錄玩家是否正在裝填彈匣。
    let reloading = false;
    // 記錄裝填完成的時間戳記。
    let reloadCompleteAt = 0;
    // 記錄裝填動作開始時間，供武器模型播放動畫。
    let reloadStartedAt = 0;
    // 記錄換彈過程中的機械提示音是否已播放。
    let reloadClickPlayed = false;
    // 記錄下次允許開火的時間。
    let nextShotAt = 0;
    // 記錄累計分數與擊倒敵人數量。
    let score = 0;
    // 記錄目前敵軍波次。
    let wave = 1;
    // 記錄本波尚未生成的敵人數量。
    let pendingEnemies = 5;
    // 記錄敵軍生成間隔計時。
    let spawnTimer = 0;
    // 記錄上一波結束後的波次轉場時間。
    let intermission = 0;
    // 儲存目前場上的敵軍角色。
    let enemies = [];
    // 記錄樹木、岩石和木箱的圓形碰撞區，避免玩家穿過場景障礙物。
    const obstacles = [];
    // 儲存敵軍射出的子彈與曳光彈物件。
    let enemyShots = [];
    // 儲存短暫可見的玩家射擊曳光線。
    let tracers = [];
    // 儲存 HUD 通知的文字與消失時間。
    let toastTimer = 0;
    // 記錄槍口火光何時熄滅。
    let muzzleUntil = 0;

      moonLight.intensity = .08 + (1 - daylight) * .27;
      // 計算太陽沿天空弧線的世界座標。
      const sunX = player.x + Math.cos(angle) * 128, sunY = 25 + Math.sin(angle) * 85, sunZ = player.z - 145;
      // 將太陽球體與方向光對準同一位置。
      sunMesh.position.set(sunX, sunY, sunZ); sunLight.position.set(sunX, sunY, sunZ); sunLight.target.position.set(player.x, 0, player.z);
      // 將月亮放在太陽對側的天空。
      moonMesh.position.set(player.x - Math.cos(angle) * 118, 25 - Math.sin(angle) * 78, player.z - 145);
      // 月亮與星星只在夜晚明顯可見。
      moonMesh.visible = daylight < .12; stars.visible = daylight < .42;
      // 將星空點雲中心跟隨玩家，保持頭頂天空完整。
      stars.position.set(player.x, 0, player.z);
      // 太陽只在地平線以上時顯示。
      sunMesh.visible = daylight > .02;
      // 傳回日夜相位與亮度，供 HUD 顯示時間使用。
      return { phase, daylight };
    }
    // 更新高空雲朵的位置，模擬持續風向。
    function updateClouds(dt) {
      // 逐朵平移雲群並讓雲朵在戰場上循環。
      for (const cloud of cloudObjects) { cloud.position.x += cloud.userData.speed * dt; if (cloud.position.x > player.x + 160) cloud.position.x = player.x - 160; }
    }
    // 更新畫面上的時間、生命、體力和彈藥數值。
    function updateHUD(now, light) {
      // 由日夜相位換算遊戲內總分鐘數。
      const totalMinutes = Math.floor(light.phase * 24 * 60);
      // 將遊戲內時間拆成小時和分鐘。
      const hour = Math.floor(totalMinutes / 60), minute = totalMinutes % 60;
      // 顯示遊戲內 24 小時制時間。
      ui.time.textContent = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
      // 更新波次編號。
      ui.wave.textContent = String(wave).padStart(2, '0');
      // 更新天氣名稱。
      ui.weather.textContent = weather;
      // 更新分數並補上前導零。
      ui.score.textContent = String(score).padStart(6, '0');
      // 更新玩家生命值數字。
      ui.health.textContent = String(Math.ceil(health));
      // 更新生命條寬度。
      ui.healthFill.style.width = `${Math.max(0, health)}%`;
      // 生命偏低時將生命條改為警示紅色。
      ui.healthFill.style.background = health < 30 ? 'linear-gradient(90deg,#9d4c43,#db8167)' : 'linear-gradient(90deg,#71936a,#a9c18c)';
      // 更新體力百分比文字與條狀長度。
      ui.stamina.textContent = `${Math.round(stamina)}%`; ui.staminaFill.style.width = `${stamina}%`;
      // 更新目前彈匣數量和備彈數。
      ui.ammo.innerHTML = `${String(ammo).padStart(2, '0')} <span style="color:#899184;font-size:17px">/ ${reserveAmmo}</span>`;
      // 顯示武器就緒或換彈中的狀態。
      ui.weapon.textContent = reloading ? `${currentWeapon().name}　·　裝填中…` : `${currentWeapon().name}　·　READY`;
      // 倒數中央提示訊息並於時間到後隱藏。
      if (toastTimer > 0) { toastTimer -= 1 / 60; if (toastTimer <= 0) toast.classList.remove('visible'); }
    }
    // 啟動第一人稱滑鼠控制並隱藏開始畫面。
    function enterBattle() {
      // 遊戲結束後不允許以點擊繼續原場戰鬥。
      if (gameOver) return;
      // 由使用者點擊解鎖瀏覽器音訊並啟動戰場氛圍音樂。
      ensureAudio(); setMusicPaused(false);
      // 記錄遊戲已經開始。
      started = true;
      // 請瀏覽器鎖定滑鼠游標，讓移動量用於視角控制。
      canvas.requestPointerLock();
    }
    // 將滑鼠視角輸入轉換成攝影機左右和上下角度。
    function onMouseMove(event) {
      // 只有鎖定滑鼠且遊戲正在進行時才更新視角。
      if (!locked || paused || gameOver) return;
      // 依滑鼠水平位移改變左右視角。
      yaw -= event.movementX * .0022;
      // 依滑鼠垂直位移改變上下視角並限制仰俯角。
      pitch = THREE.MathUtils.clamp(pitch - event.movementY * .002, -1.34, 1.34);
    }
    // 顯示遊戲暫停狀態的中央文字。
    function showPauseOverlay() {
      // 更新標題、操作文字與提示。
      overlayTitle.textContent = '任務暫停'; overlayText.textContent = '目前戰場已暫停。確認周遭狀況後，點擊畫面即可回到戰鬥。'; overlayHint.textContent = '點擊畫面繼續　·　ESC 釋放滑鼠';
      // 顯示覆蓋面板。
      overlay.classList.remove('hidden');
    }
    // 顯示任務結束資訊與重新開始方式。
    function showGameOver() {
      // 更新結束標題。
      overlayTitle.textContent = '任務中止';
      // 顯示本場累計分數和抵達波次。
      overlayText.textContent = `生命值耗盡。最終得分 ${score}，抵達第 ${wave} 波。`;
      // 顯示重新開始提示。
      overlayHint.textContent = '按 Enter 重新部署';
      // 任務結束後將背景音樂柔和轉低。
      setMusicPaused(true);
      // 顯示結束面板。
      overlay.classList.remove('hidden');
      // 釋放滑鼠鎖定，讓玩家可以使用網頁游標。
      if (document.pointerLockElement) document.exitPointerLock();
    }
    // 重新設定所有玩家、敵人、彈藥與波次狀態。
    function restartGame() {
      // 重設玩家位置、跳躍高度和視角方向。
      player.x = 0; player.z = 0; player.jump = 0; player.verticalSpeed = 0; yaw = 0; pitch = 0;
      // 將攝影機重設到出生地形表面上方並清除舊視角角度。
      camera.position.set(player.x, terrainHeight(player.x, player.z) + 1.68, player.z); camera.rotation.set(0, 0, 0);
      // 重設三種武器各自的初始彈匣和備用彈藥。
      weaponTypes.forEach((item, index) => { weaponInventory[index] = { ammo: item.magazine, reserve: item.reserve }; });
      // 回到突擊步槍並恢復生命、體力和彈藥。
      weaponIndex = 0; health = 100; stamina = 100; ammo = weaponInventory[0].ammo; reserveAmmo = weaponInventory[0].reserve;
      // 重置換彈階段、槍枝姿態和快捷欄選取狀態。
      reloadStartedAt = 0; reloadClickPlayed = false; applyWeaponModel(); weapon.rotation.set(0, 0, 0); weapon.position.y = -.31;
      // 重設分數、波次和敵軍生成數。
      score = 0; wave = 1; pendingEnemies = 5; spawnTimer = 0; intermission = 0;
      // 重設換彈、傷害和遊戲結束狀態。
      reloading = false; hurtCooldown = 0; gameOver = false; paused = false; started = false; setMusicPaused(false);
      // 移除戰場上所有敵人模型。
      for (const enemy of enemies) scene.remove(enemy.group);
      // 清空敵軍陣列。
      enemies = [];
      // 移除尚未消失的敵方彈體。
      for (const shot of enemyShots) { scene.remove(shot.mesh); shot.mesh.geometry.dispose(); shot.mesh.material.dispose(); }
      // 清空敵方彈體清單。
      enemyShots = [];
      // 移除尚未消失的玩家曳光線。
      for (const tracer of tracers) { scene.remove(tracer.object); tracer.geometry.dispose(); }
      // 清空曳光線清單。
      tracers = [];
      // 重新啟動日夜循環和晴朗天氣。
      dayStart = performance.now() - DAY_LENGTH * .32; weather = '晴朗'; weatherIndex = 0; weatherChangedAt = performance.now();
      // 顯示開始任務面板。
      overlayTitle.textContent = '前線哨站'; overlayText.textContent = '第一人稱 3D 生存射擊。清除逐波逼近的敵軍，在變化的日夜與天候中守住哨站。WASD 移動、滑鼠瞄準、左鍵射擊；按 1／2／3 切換武器，R 換彈，M 切換音效。'; overlayHint.textContent = '點擊畫面進入戰場　·　ESC 可釋放滑鼠'; overlay.classList.remove('hidden');
    }
    // 讓畫面尺寸改變時同步更新攝影機比例和渲染器大小。
    window.addEventListener('resize', () => {
      // 讀取最新的瀏覽器寬度和高度。
      const width = window.innerWidth, height = window.innerHeight;
      // 更新攝影機視角寬高比。
      camera.aspect = width / height; camera.updateProjectionMatrix();
      // 更新渲染器輸出尺寸。
      renderer.setSize(width, height, false);
      // 重新限制畫面像素比，平衡清晰度與效能。
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    });
    // 當滑鼠移動時更新第一人稱視角。
    document.addEventListener('mousemove', onMouseMove);
    // 當瀏覽器成功鎖定或釋放滑鼠時同步遊戲狀態。
    document.addEventListener('pointerlockchange', () => {
      // 更新目前滑鼠鎖定狀態。
      locked = document.pointerLockElement === canvas;
      // 取得滑鼠鎖定後自動進入戰鬥。
      if (locked) { started = true; paused = false; setMusicPaused(false); overlay.classList.add('hidden'); }
      // 玩家按 ESC 釋放滑鼠時顯示暫停提示。
      else if (started && !gameOver) { paused = true; mouseDown = false; setMusicPaused(true); showPauseOverlay(); }
    });
    // 音效按鈕可在開始前或戰鬥中開關背景音樂與槍械音效。
    soundToggle.addEventListener('click', (event) => { event.stopPropagation(); setSoundEnabled(!soundEnabled); });
    // 點擊覆蓋面板時開始任務或重新取得滑鼠控制。
    overlay.addEventListener('click', () => { if (!gameOver) enterBattle(); });
    // 監聽畫布滑鼠按下事件以進行射擊或第一次鎖定。
    canvas.addEventListener('pointerdown', (event) => {
      // 只使用滑鼠左鍵開火。
      if (event.button !== 0) return;
      // 尚未取得滑鼠鎖定時，第一次點擊只開始戰鬥。
      if (!locked) { enterBattle(); return; }
      // 遊戲正常進行時按住左鍵會持續射擊。
      if (!paused && !gameOver) mouseDown = true;
    });
    // 釋放滑鼠左鍵後停止連發。
    window.addEventListener('pointerup', () => { mouseDown = false; });
    // 監聽按鍵按下事件並處理移動、換彈、暫停等操作。
    window.addEventListener('keydown', (event) => {
      // 阻止空白鍵、方向鍵和 Tab 以外的操作捲動頁面。
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
      // 記錄目前按鍵狀態供持續移動判斷。
      keys[event.code] = true;
      // 按 R 時開始手動換彈。
      if (event.code === 'KeyR' && !gameOver) beginReload();
      // 按 1、2、3 切換至突擊步槍、狙擊槍或散彈槍。
      if (['Digit1', 'Numpad1'].includes(event.code)) selectWeapon(0);
      if (['Digit2', 'Numpad2'].includes(event.code)) selectWeapon(1);
      if (['Digit3', 'Numpad3'].includes(event.code)) selectWeapon(2);
      // 按 M 切換背景音樂和槍械效果音。
      if (event.code === 'KeyM' && !event.repeat) setSoundEnabled(!soundEnabled);
      // 按 P 時切換暫停狀態並釋放滑鼠鎖定。
      if (event.code === 'KeyP' && started && !gameOver) { paused = !paused; if (paused) { mouseDown = false; showPauseOverlay(); if (document.pointerLockElement) document.exitPointerLock(); } else enterBattle(); }
      // 任務結束時按 Enter 重新部署。
      if (event.code === 'Enter' && gameOver) restartGame();
    });
    // 按鍵放開時清除對應的移動輸入狀態。
    window.addEventListener('keyup', (event) => { keys[event.code] = false; });
    // 避免右鍵或中鍵在遊戲畫面開啟瀏覽器選單。
    canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    // 主動畫迴圈負責所有狀態更新和 3D 場景繪製。
    function animate(now) {
      // 使用時間差讓不同更新率的螢幕都有一致速度。
      const dt = Math.min(.04, (now - lastFrame) / 1000);
      // 更新上一幀時間戳記。
      lastFrame = now;
      // 即使未開始遊戲，日夜、雲層與背景天氣仍持續動畫。
      const light = updateDayNight(now);
      // 只有進行中的任務才更新玩家和敵人邏輯。
      if (started && !paused && !gameOver) {
        // 更新玩家位置、跳躍、體力、射擊和換彈狀態。
        updatePlayer(dt, now);
        // 更新敵軍接近、射擊與波次生成。
        updateEnemies(dt, now);
        // 更新敵方彈體與命中傷害。
        updateEnemyShots(dt);
      }
      // 更新雲朵位置和天氣粒子效果。
      updateClouds(dt); updateWeather(dt, now);
      // 更新玩家射擊曳光線的生命週期。
      updateTracers(dt);
      // 玩家生命歸零時結束任務。
      if (health <= 0 && !gameOver) { gameOver = true; showGameOver(); }
      // 將玩家附近的物件陰影焦點跟隨攝影機。
      sunLight.shadow.camera.updateProjectionMatrix();
      // 更新 HUD 的戰況、狀態條和時間文字。
      updateHUD(now, light);
      // 繪製目前場景與攝影機畫面。
      renderer.render(scene, camera);
      // 要求瀏覽器在下一個畫面更新週期呼叫動畫迴圈。
      requestAnimationFrame(animate);
    }
    // 啟動 Three.js 動畫迴圈。
    requestAnimationFrame(animate);
  </script>
